services:
  - type: web
    name: provider-intelligence-hub-api
    runtime: node
    repo: https://github.com/Occumed79/Provider-Intelligence-Hub
    branch: main
    plan: free
    buildCommand: corepack enable && pnpm install --no-frozen-lockfile && pnpm --filter @workspace/api-server build
    startCommand: pnpm --filter @workspace/api-server start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false

  - type: web
    name: provider-intelligence-hub-frontend
    runtime: static
    repo: https://github.com/Occumed79/Provider-Intelligence-Hub
    branch: main
    buildCommand: corepack enable && pnpm install --no-frozen-lockfile && pnpm --filter @workspace/occu-med-hub build
    staticPublishPath: artifacts/occu-med-hub/dist/public
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: BASE_PATH
        value: /
